<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Bingo Card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    padding: 20px 20px 20px 232px;
    position: relative;
  }

  /* ===== Tab 切换 ===== */
  .tab-bar {
    display: flex;
    justify-content: center;
    gap: 0;
    margin-bottom: 24px;
  }

  .tab-btn {
    padding: 10px 32px;
    font-size: 15px;
    border: 2px solid #ddd;
    background: #fff;
    color: #888;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .tab-btn:first-child { border-radius: 8px 0 0 8px; }
  .tab-btn:last-child { border-radius: 0 8px 8px 0; }
  .tab-btn.active {
    background: #4a90e2;
    color: #fff;
    border-color: #4a90e2;
  }
  .tab-btn:hover:not(.active) { background: #f0f0f0; }

  /* ===== 容器 ===== */
  .table-container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 30px 24px;
  }
  .table-container.hidden { display: none; }

  .title-area { text-align: center; margin-bottom: 24px; }

  .main-title {
    font-size: 28px;
    font-weight: 700;
    color: #222;
    outline: none;
    border: none;
    border-bottom: 2px dashed transparent;
    padding: 4px 12px;
    text-align: center;
    width: 100%;
    max-width: 800px;
    transition: border-color 0.2s;
    background: transparent;
  }
  .main-title:hover, .main-title:focus { border-bottom-color: #999; }
  .main-title::placeholder { color: #bbb; }

  .subtitle-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    margin-top: 8px;
    flex-wrap: wrap;
    width: 100%;
  }

  .subtitle {
    font-size: 15px;
    color: #555;
    outline: none;
    border: none;
    border-bottom: 1px dashed transparent;
    padding: 2px 6px;
    text-align: center;
    background: transparent;
    transition: border-color 0.2s;
    min-width: 60px;
    width: auto;
    max-width: 100%;
    flex: 1;
  }
  .subtitle:hover, .subtitle:focus { border-bottom-color: #999; }
  .subtitle::placeholder { color: #ccc; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .cell-wrap {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .cell-caption {
    margin-top: 6px;
    width: 100%;
    min-height: 28px;
    border: none;
    border-bottom: 1px dashed #ccc;
    background: transparent;
    text-align: center;
    font-size: 13px;
    color: #444;
    outline: none;
    font-family: inherit;
    padding: 4px 4px 2px;
  }
  .cell-caption:hover, .cell-caption:focus { border-bottom-color: #666; }
  .cell-caption::placeholder { color: #bbb; }
  .grid.hide-captions .cell-caption { display: none; }

  /* ===== 单元格通用 ===== */
  .cell {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 2px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
    background: #fafafa;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .cell:hover {
    border-color: #888;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  /* ===== Table1: 图片表格的标签 ===== */
  .cell-label {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #555;
    background: transparent;
    padding: 0;
    z-index: 2;
    cursor: text;
    max-width: calc(100% - 16px);
    outline: none;
    border: none;
    transition: none;
  }

  .cell-number {
    position: absolute;
    bottom: 6px;
    right: 8px;
    font-size: 11px;
    color: #ccc;
    z-index: 2;
    pointer-events: none;
  }

  .cell-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  .cell-image.visible { display: block; }

  .cell-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ccc;
    font-size: 36px;
    pointer-events: none;
    transition: color 0.2s;
  }
  .cell:hover .cell-placeholder { color: #aaa; }
  .cell.has-image .cell-placeholder { display: none; }

  .cell input[type="file"] { display: none; }

  .remove-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 22px;
    height: 22px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    z-index: 3;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s, background 0.2s;
  }
  .remove-btn:hover { background: rgba(220,50,50,0.8); }
  .cell.has-image .remove-btn { display: flex; }
  .cell:hover .remove-btn { opacity: 1; }

  /* ===== Table2: 文字表格的文本 ===== */
  .cell-text {
    position: absolute;
    inset: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    z-index: 2;
    outline: none;
    border: none;
    background: transparent;
    text-align: center;
    overflow: hidden;
    word-break: break-word;
    white-space: pre-wrap;
    cursor: text;
    font-family: inherit;
    line-height: 1.3;
  }
  .cell-text:empty::before {
    content: attr(data-placeholder);
    color: #ccc;
    font-weight: 400;
  }

  .cell-blank-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    resize: none;
    background: transparent;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    font-family: inherit;
    line-height: 1.3;
    padding: 22% 10px 10px;
    outline: none;
    z-index: 4;
    overflow: hidden;
    cursor: text;
  }
  .cell-blank-input::placeholder { color: #ccc; font-weight: 400; }

  /* ===== 添加按钮 ===== */
  .add-cell-btn {
    font-size: 16px;
    padding: 8px 24px;
    border: 2px dashed #ccc;
    border-radius: 8px;
    background: transparent;
    color: #999;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .add-cell-btn:hover { border-color: #888; color: #555; }
  .del-last-btn { margin-left: 8px; }
  .del-last-btn:hover { border-color: #c55; color: #c55; }

  .cell-wrap { position: relative; }
  .del-cell-btn {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 20px;
    height: 20px;
    border: 0;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    color: #fff;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 6;
  }
  .cell-wrap:hover .del-cell-btn { display: flex; }
  .del-cell-btn:hover { background: rgba(220,50,50,0.85); }

  @media (max-width: 600px) {
    .table-container { padding: 16px 12px; }
    .main-title { font-size: 22px; }
    .grid { gap: 8px; }
    .cell-label { font-size: 11px; }
    .cell-text { font-size: 14px; }
    .tab-btn { padding: 8px 20px; font-size: 14px; }
  }

  /* ===== 设置面板 ===== */
  .settings-panel {
    position: fixed;
    right: 0;
    top: 0;
    width: 290px;
    height: 100vh;
    background: #fff;
    box-shadow: -2px 0 12px rgba(0,0,0,0.1);
    padding: 20px;
    z-index: 1000;
    overflow-y: auto;
    transition: transform 0.3s ease;
  }
  .settings-panel.collapsed { transform: translateX(100%); }

  .settings-toggle {
    position: fixed;
    right: 290px;
    top: 20px;
    width: 40px;
    height: 40px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    z-index: 1001;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transition: right 0.3s ease, background 0.2s;
  }
  .settings-toggle:hover { background: #f5f5f5; }
  .settings-panel.collapsed + .settings-toggle { right: 20px; }

  .settings-title {
    font-size: 18px;
    font-weight: 600;
    color: #222;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid #eee;
  }

  .setting-group { margin-bottom: 18px; }

  .setting-label {
    font-size: 14px;
    color: #555;
    margin-bottom: 8px;
    display: block;
    font-weight: 500;
  }

  .setting-input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  .setting-input:focus { border-color: #888; }

  .setting-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .setting-radio {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    background: #fff;
    user-select: none;
  }
  .setting-radio.active {
    background: #4a90e2;
    color: #fff;
    border-color: #4a90e2;
  }
  .setting-radio:hover:not(.active) { background: #f5f5f5; }

  /* 3x3 位置选择器 */
  .position-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 3px;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 200px;
    margin: 0 auto;
  }
  .position-cell {
    border: 1px solid #ddd;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    background: #fff;
  }
  .position-cell:hover { background: #e8f0fe; border-color: #4a90e2; }
  .position-cell.active { background: #4a90e2; border-color: #4a90e2; }

  .color-picker-wrapper {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .color-input {
    width: 44px;
    height: 36px;
    padding: 2px;
    border: 1px solid #ddd;
    border-radius: 6px;
    cursor: pointer;
  }

  .range-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #999;
    margin-top: 4px;
  }

  /* ===== 左侧 Emoji ===== */
  .emoji-dock {
    position: fixed;
    left: 0;
    top: 0;
    width: 212px;
    height: 100vh;
    background: #fff;
    border-right: 1px solid #e6e6e6;
    box-shadow: 2px 0 12px rgba(0,0,0,0.04);
    z-index: 900;
    display: flex;
    flex-direction: column;
  }
  .emoji-dock h2 {
    font-size: 14px;
    font-weight: 600;
    color: #333;
    padding: 14px 12px 8px;
  }
  .emoji-search {
    margin: 0 12px 8px;
    padding: 7px 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
  }
  .emoji-search:focus { border-color: #4a90e2; }
  .emoji-cats {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 0 10px 8px;
  }
  .emoji-cat {
    border: 1px solid #eee;
    background: #fafafa;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 11px;
    color: #666;
    cursor: pointer;
    font-family: inherit;
  }
  .emoji-cat.active { background: #4a90e2; color: #fff; border-color: #4a90e2; }
  .emoji-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px 16px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
    align-content: start;
  }
  .emoji-item {
    width: 100%;
    aspect-ratio: 1;
    border: 0;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    border-radius: 6px;
    padding: 0;
  }
  .emoji-item:hover { background: #f0f4ff; }
  .emoji-item:active { cursor: grabbing; }
  .emoji-sprite {
    display: block;
    pointer-events: none;
    flex: 0 0 auto;
  }
  img.emoji-sprite { object-fit: contain; }
  .emoji-hint {
    font-size: 11px;
    color: #999;
    padding: 0 12px 10px;
    line-height: 1.4;
  }
  .emoji-sticker {
    position: absolute;
    z-index: 500;
    line-height: 0;
    cursor: pointer;
    user-select: none;
    touch-action: none;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.12));
    box-sizing: content-box;
  }
  .emoji-sticker.is-selected {
    z-index: 620;
    outline: 2px solid #4a90e2;
    outline-offset: 3px;
    cursor: grab;
  }
  .emoji-sticker.is-selected:active { cursor: grabbing; }
  .emoji-sticker .sticker-x {
    position: absolute;
    top: -12px;
    right: -12px;
    width: 18px;
    height: 18px;
    border: 0;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 12px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
    z-index: 2;
  }
  .emoji-sticker.is-selected .sticker-x { display: flex; }
  .sticker-handle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #fff;
    border: 2px solid #4a90e2;
    border-radius: 2px;
    display: none;
    z-index: 2;
    box-sizing: border-box;
  }
  .emoji-sticker.is-selected .sticker-handle { display: block; }
  .sticker-handle.nw { top: -6px; left: -6px; cursor: nwse-resize; }
  .sticker-handle.ne { top: -6px; right: -6px; cursor: nesw-resize; }
  .sticker-handle.sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
  .sticker-handle.se { bottom: -6px; right: -6px; cursor: nwse-resize; }
  .cell.blank { cursor: text; }
  .cell.blank:hover { box-shadow: none; }

  @media (max-width: 720px) {
    body { padding-left: 20px; }
    .emoji-dock { width: 100%; height: 42vh; border-right: 0; border-bottom: 1px solid #e6e6e6; }
  }
</style>
</head>
<body>

<aside class="emoji-dock">
  <h2>Emoji</h2>
  <input class="emoji-search" id="emojiSearch" type="search" placeholder="搜索 笑/哭/爱 或英文">
  <div class="emoji-cats" id="emojiCats"></div>
  <p class="emoji-hint">黄豆含安卓厨房组合。拖到页面后先点选，再拖或拉角缩放。</p>
  <div class="emoji-list" id="emojiList"></div>
</aside>

<!-- ===== Tab 切换 ===== -->
<div class="tab-bar">
  <button class="tab-btn active" data-table="1">图片表格</button>
  <button class="tab-btn" data-table="3">空白表格</button>
  <button class="tab-btn" data-table="2">文字表格</button>
</div>

<!-- ===== 表格1：图片表格 ===== -->
<div class="table-container" id="container1">
  <div class="title-area">
    <input class="main-title" type="text" placeholder="点击输入标题">
    <div class="subtitle-row">
      <input class="subtitle" type="text" placeholder="点击输入副标题">
      <input class="subtitle" type="text" placeholder="点击输入署名">
    </div>
  </div>
  <div class="grid" id="grid1"></div>
  <div style="text-align:center; margin-top:16px;">
    <button class="add-cell-btn" data-grid="1">+ 添加格子</button>
    <button class="add-cell-btn del-last-btn" data-grid="1" data-act="del">− 删除格子</button>
  </div>
</div>

<!-- ===== 表格3：空白表格 ===== -->
<div class="table-container hidden" id="container3">
  <div class="title-area">
    <input class="main-title" type="text" placeholder="点击输入标题">
    <div class="subtitle-row">
      <input class="subtitle" type="text" placeholder="点击输入副标题">
      <input class="subtitle" type="text" placeholder="点击输入署名">
    </div>
  </div>
  <div class="grid" id="grid3"></div>
  <div style="text-align:center; margin-top:16px;">
    <button class="add-cell-btn" data-grid="3">+ 添加格子</button>
    <button class="add-cell-btn del-last-btn" data-grid="3" data-act="del">− 删除格子</button>
  </div>
</div>

<!-- ===== 表格2：文字表格 ===== -->
<div class="table-container hidden" id="container2">
  <div class="title-area">
    <input class="main-title" type="text" placeholder="点击输入标题">
    <div class="subtitle-row">
      <input class="subtitle" type="text" placeholder="点击输入副标题">
      <input class="subtitle" type="text" placeholder="点击输入署名">
    </div>
  </div>
  <div class="grid" id="grid2"></div>
  <div style="text-align:center; margin-top:16px;">
    <button class="add-cell-btn" data-grid="2">+ 添加格子</button>
    <button class="add-cell-btn del-last-btn" data-grid="2" data-act="del">− 删除格子</button>
  </div>
</div>

<!-- ===== 设置面板 ===== -->
<div class="settings-panel" id="settingsPanel"></div>
<button class="settings-toggle" id="settingsToggle">⚙️</button>

<script src="emoji-data.js"></script>
<script src="kitchen-data.js"></script>
<script>
// ==============================
// 状态
// ==============================
let activeTable = 1;

const tableSettings = {
  1: {
    labelFontSize: 13,
    horizontalAlign: 'left',
    verticalAlign: 'top',
    cellBgColor: '#fafafa',
    cellBorderColor: '#dddddd',
    labelColor: '#555555',
    labelStrokeColor: '#ffffff',
    labelStrokeWidth: 0,
    cellGap: 12,
    borderRadius: 8,
    columnsCount: 4,
    showCaptions: 'on'
  },
  2: {
    textFontSize: 18,
    textHAlign: 'center',
    textVAlign: 'middle',
    textColor: '#333333',
    textStrokeColor: '#ffffff',
    textStrokeWidth: 0,
    cellBgColor: '#fafafa',
    cellBorderColor: '#dddddd',
    cellGap: 12,
    borderRadius: 8,
    columnsCount: 4,
    showCaptions: 'on'
  },
  3: {
    cellBgColor: '#ffffff',
    cellBorderColor: '#dddddd',
    cellGap: 12,
    borderRadius: 8,
    columnsCount: 4,
    showCaptions: 'on'
  }
};

// ==============================
// 快捷 DOM 访问
// ==============================
function gridEl(n) { return document.getElementById('grid' + n); }
function containerEl(n) { return document.getElementById('container' + n); }

// ==============================
// 设置面板
// ==============================
const settingsPanel = document.getElementById('settingsPanel');
const settingsToggle = document.getElementById('settingsToggle');

settingsToggle.addEventListener('click', () => {
  settingsPanel.classList.toggle('collapsed');
});

// ==============================
// Tab 切换
// ==============================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = parseInt(btn.dataset.table);
    if (t === activeTable) return;
    activeTable = t;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    [1, 2, 3].forEach(n => containerEl(n).classList.toggle('hidden', t !== n));
    renderSettingsPanel();
  });
});

// ==============================
// 渲染设置面板
// ==============================
function renderSettingsPanel() {
  const s = tableSettings[activeTable];
  let html = '<div class="settings-title">⚙️ 表格设置</div>';

  if (activeTable === 1) {
    html += `
      <div class="setting-group">
        <label class="setting-label">标题字体大小</label>
        <input type="number" class="setting-input" id="sLabelFontSize" value="${s.labelFontSize}" min="8" max="48">
      </div>
      <div class="setting-group">
        <label class="setting-label">水平对齐</label>
        <div class="setting-row">
          <div class="setting-radio${s.horizontalAlign==='left'?' active':''}" data-key="horizontalAlign" data-val="left">居左</div>
          <div class="setting-radio${s.horizontalAlign==='center'?' active':''}" data-key="horizontalAlign" data-val="center">居中</div>
        </div>
      </div>
      <div class="setting-group">
        <label class="setting-label">垂直对齐</label>
        <div class="setting-row">
          <div class="setting-radio${s.verticalAlign==='top'?' active':''}" data-key="verticalAlign" data-val="top">居上</div>
          <div class="setting-radio${s.verticalAlign==='bottom'?' active':''}" data-key="verticalAlign" data-val="bottom">居下</div>
        </div>
      </div>
      <div class="setting-group">
        <label class="setting-label">单元格背景色</label>
        <div class="color-picker-wrapper">
          <input type="color" class="color-input" id="sCellBgColor" value="${s.cellBgColor}">
          <input type="text" class="setting-input" id="sCellBgColorText" value="${s.cellBgColor}" style="flex:1;">
        </div>
      </div>

function renderPositionGrid() {
  const pg = document.getElementById('positionGrid');
  if (!pg) return;
  const s = tableSettings[2];
  const hLabels = ['left', 'center', 'right'];
  const vLabels = ['top', 'middle', 'bottom'];
  const hMap = { left: 0, center: 1, right: 2 };
  const vMap = { top: 0, middle: 1, bottom: 2 };
  const ar = vMap[s.textVAlign], ac = hMap[s.textHAlign];

  pg.innerHTML = '';
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      const d = document.createElement('div');
      d.className = 'position-cell' + (r === ar && c === ac ? ' active' : '');
      d.dataset.h = hLabels[c];
      d.dataset.v = vLabels[r];
      d.addEventListener('click', () => {
        s.textHAlign = d.dataset.h;
        s.textVAlign = d.dataset.v;
        updateAllText2Positions();
        renderPositionGrid();
      });
      pg.appendChild(d);
    }
  }
}

// ==============================
// 设置事件绑定
// ==============================
function bindSettingsEvents() {
  const s = tableSettings[activeTable];

  function bindColor(cid, tid, key) {
    const ce = document.getElementById(cid), te = document.getElementById(tid);
    if (!ce || !te) return;
    ce.addEventListener('input', e => { s[key] = e.target.value; te.value = e.target.value; applySetting(key, e.target.value); });
    te.addEventListener('input', e => { if (/^#[0-9A-Fa-f]{6}$/.test(e.target.value)) { s[key] = e.target.value; ce.value = e.target.value; applySetting(key, e.target.value); } });
  }

  function bindRange(rid, vid, key, unit) {
    const re = document.getElementById(rid), ve = document.getElementById(vid);
    if (!re || !ve) return;
    re.addEventListener('input', e => { const v = e.target.value; s[key] = parseInt(v); ve.textContent = v + unit; applySetting(key, v); });
  }

  function bindNum(iid, key) {
    const ie = document.getElementById(iid);
    if (!ie) return;
    ie.addEventListener('input', e => { const v = parseInt(e.target.value); if (!isNaN(v)) { s[key] = v; applySetting(key, v); } });
  }

  settingsPanel.querySelectorAll('.setting-radio').forEach(radio => {
    radio.addEventListener('click', () => {
      const p = radio.parentElement;
      p.querySelectorAll('.setting-radio').forEach(r => r.classList.remove('active'));
      radio.classList.add('active');
      s[radio.dataset.key] = radio.dataset.val;
      applySetting(radio.dataset.key, radio.dataset.val);
    });
  });

  if (activeTable === 1) {
    bindNum('sLabelFontSize', 'labelFontSize');
    bindColor('sCellBgColor', 'sCellBgColorText', 'cellBgColor');
    bindColor('sCellBorderColor', 'sCellBorderColorText', 'cellBorderColor');
    bindColor('sLabelColor', 'sLabelColorText', 'labelColor');
    bindColor('sLabelStrokeColor', 'sLabelStrokeColorText', 'labelStrokeColor');
    bindRange('sLabelStrokeWidth', 'sLabelStrokeWidthVal', 'labelStrokeWidth', 'px');
  } else if (activeTable === 2) {
    bindNum('sTextFontSize', 'textFontSize');
    bindColor('sTextColor', 'sTextColorText', 'textColor');
    bindColor('sTextStrokeColor', 'sTextStrokeColorText', 'textStrokeColor');
    bindColor('sCellBgColor', 'sCellBgColorText', 'cellBgColor');
    bindColor('sCellBorderColor', 'sCellBorderColorText', 'cellBorderColor');
    bindRange('sTextStrokeWidth', 'sTextStrokeWidthVal', 'textStrokeWidth', 'px');
  } else {
    bindColor('sCellBgColor', 'sCellBgColorText', 'cellBgColor');
    bindColor('sCellBorderColor', 'sCellBorderColorText', 'cellBorderColor');
  }
  bindRange('sCellGap', 'sCellGapVal', 'cellGap', 'px');
  bindRange('sBorderRadius', 'sBorderRadiusVal', 'borderRadius', 'px');
  bindNum('sColumnsCount', 'columnsCount');
}

// ==============================
// 应用设置到 DOM
// ==============================
function applySetting(key, value) {
  const t = activeTable;
  if (key === 'showCaptions') {
    gridEl(t).classList.toggle('hide-captions', value === 'off');
    return;
  }
  if (t === 1) {
    switch (key) {
      case 'labelFontSize':
        gridEl(1).querySelectorAll('.cell-label').forEach(el => el.style.fontSize = value + 'px');
        break;
      case 'horizontalAlign': case 'verticalAlign': updateAllTable1Labels(); break;
      case 'cellBgColor':
        gridEl(1).querySelectorAll('.cell').forEach(el => el.style.background = value);
        break;
      case 'cellBorderColor':
        gridEl(1).querySelectorAll('.cell').forEach(el => el.style.borderColor = value);
        break;
      case 'labelColor':
        gridEl(1).querySelectorAll('.cell-label').forEach(el => el.style.color = value);
        break;
      case 'labelStrokeColor': case 'labelStrokeWidth': updateAllTable1Stroke(); break;
      case 'cellGap': gridEl(1).style.gap = value + 'px'; break;
      case 'borderRadius':
        gridEl(1).querySelectorAll('.cell').forEach(el => el.style.borderRadius = value + 'px');
        break;
      case 'columnsCount': gridEl(1).style.gridTemplateColumns = `repeat(${value}, 1fr)`; break;
    }
  } else if (t === 2) {
    switch (key) {
      case 'textFontSize':
        gridEl(2).querySelectorAll('.cell-text').forEach(el => el.style.fontSize = value + 'px');
        break;
      case 'textHAlign': case 'textVAlign': updateAllText2Positions(); break;
      case 'textColor':
        gridEl(2).querySelectorAll('.cell-text').forEach(el => el.style.color = value);
        break;
      case 'textStrokeColor': case 'textStrokeWidth': updateAllText2Strokes(); break;
      case 'cellBgColor':
        gridEl(2).querySelectorAll('.cell').forEach(el => el.style.background = value);
        break;
      case 'cellBorderColor':
        gridEl(2).querySelectorAll('.cell').forEach(el => el.style.borderColor = value);
        break;
      case 'cellGap': gridEl(2).style.gap = value + 'px'; break;
      case 'borderRadius':
        gridEl(2).querySelectorAll('.cell').forEach(el => el.style.borderRadius = value + 'px');
        break;
      case 'columnsCount': gridEl(2).style.gridTemplateColumns = `repeat(${value}, 1fr)`; break;
    }
  } else {
    switch (key) {
      case 'cellBgColor':
        gridEl(3).querySelectorAll('.cell').forEach(el => el.style.background = value);
        break;
      case 'cellBorderColor':
        gridEl(3).querySelectorAll('.cell').forEach(el => el.style.borderColor = value);
        break;
      case 'cellGap': gridEl(3).style.gap = value + 'px'; break;
      case 'borderRadius':
        gridEl(3).querySelectorAll('.cell').forEach(el => el.style.borderRadius = value + 'px');
        break;
      case 'columnsCount': gridEl(3).style.gridTemplateColumns = `repeat(${value}, 1fr)`; break;
    }
  }
}

function updateAllTable1Labels() {
  const s = tableSettings[1];
  gridEl(1).querySelectorAll('.cell-label').forEach(label => {
    label.style.textAlign = s.horizontalAlign;
    label.style.left = s.horizontalAlign === 'center' ? '50%' : '8px';
    label.style.transform = s.horizontalAlign === 'center' ? 'translateX(-50%)' : 'none';
    if (s.verticalAlign === 'top') { label.style.top = '6px'; label.style.bottom = 'auto'; }
    else { label.style.top = 'auto'; label.style.bottom = '6px'; }
  });
}

function updateAllTable1Stroke() {
  const s = tableSettings[1];
  gridEl(1).querySelectorAll('.cell-label').forEach(label => {
    label.style.textShadow = s.labelStrokeWidth > 0
      ? `0 0 ${s.labelStrokeWidth}px ${s.labelStrokeColor}, 0 0 ${s.labelStrokeWidth}px ${s.labelStrokeColor}, 0 0 ${s.labelStrokeWidth}px ${s.labelStrokeColor}`
      : 'none';
  });
}

function updateAllText2Positions() {
  const s = tableSettings[2];
  gridEl(2).querySelectorAll('.cell-text').forEach(el => {
    if (s.textHAlign === 'left') { el.style.textAlign = 'left'; el.style.alignItems = 'flex-start'; }
    else if (s.textHAlign === 'right') { el.style.textAlign = 'right'; el.style.alignItems = 'flex-end'; }
    else { el.style.textAlign = 'center'; el.style.alignItems = 'center'; }
    if (s.textVAlign === 'top') el.style.justifyContent = 'flex-start';
    else if (s.textVAlign === 'bottom') el.style.justifyContent = 'flex-end';
    else el.style.justifyContent = 'center';
  });
}

function updateAllText2Strokes() {
  const s = tableSettings[2];
  gridEl(2).querySelectorAll('.cell-text').forEach(el => {
    el.style.textShadow = s.textStrokeWidth > 0
      ? `0 0 ${s.textStrokeWidth}px ${s.textStrokeColor}, 0 0 ${s.textStrokeWidth}px ${s.textStrokeColor}, 0 0 ${s.textStrokeWidth}px ${s.textStrokeColor}`
      : 'none';
  });
}

// -- Table 1: 图片+标签 --
function createTable1Cell(g, index) {
  const s = tableSettings[1];
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.style.background = s.cellBgColor;
  cell.style.borderColor = s.cellBorderColor;
  cell.style.borderRadius = s.borderRadius + 'px';

  const label = document.createElement('input');
  label.className = 'cell-label';
  label.type = 'text';
  label.placeholder = '标题';
  label.style.fontSize = s.labelFontSize + 'px';
  label.style.color = s.labelColor;
  label.style.textAlign = s.horizontalAlign;
  label.style.left = s.horizontalAlign === 'center' ? '50%' : '8px';
  label.style.transform = s.horizontalAlign === 'center' ? 'translateX(-50%)' : 'none';
  if (s.verticalAlign === 'top') { label.style.top = '6px'; } else { label.style.top = 'auto'; label.style.bottom = '6px'; }
  label.style.textShadow = s.labelStrokeWidth > 0
    ? `0 0 ${s.labelStrokeWidth}px ${s.labelStrokeColor}, 0 0 ${s.labelStrokeWidth}px ${s.labelStrokeColor}, 0 0 ${s.labelStrokeWidth}px ${s.labelStrokeColor}`
    : 'none';
  label.addEventListener('click', e => e.stopPropagation());
  label.addEventListener('mousedown', e => e.stopPropagation());

  const img = document.createElement('img');
  img.className = 'cell-image';

  const placeholder = document.createElement('div');
  placeholder.className = 'cell-placeholder';
  placeholder.textContent = '+';

  const removeBtn = document.createElement('button');
  removeBtn.className = 'remove-btn';
  removeBtn.textContent = '×';

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';

  const num = document.createElement('span');
  num.className = 'cell-number';
  num.textContent = index + 1;

  cell.appendChild(label);
  cell.appendChild(img);
  cell.appendChild(placeholder);
  cell.appendChild(removeBtn);
  cell.appendChild(fileInput);
  cell.appendChild(num);
  attachCaption(g, cell);

  cell.addEventListener('click', (e) => {
    if (e.target === label || e.target === removeBtn) return;
    fileInput.click();
  });
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => { img.src = ev.target.result; img.classList.add('visible'); cell.classList.add('has-image'); };
    reader.readAsDataURL(file);
  });
  removeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    img.src = ''; img.classList.remove('visible'); cell.classList.remove('has-image'); fileInput.value = '';
  });
}

// -- Table 2: 纯文字 --
function createTable2Cell(g, index) {
  const s = tableSettings[2];
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.style.background = s.cellBgColor;
  cell.style.borderColor = s.cellBorderColor;
  cell.style.borderRadius = s.borderRadius + 'px';

  const textDiv = document.createElement('div');
  textDiv.className = 'cell-text';
  textDiv.contentEditable = 'true';
  textDiv.setAttribute('data-placeholder', '点击输入文字');
  textDiv.style.fontSize = s.textFontSize + 'px';
  textDiv.style.color = s.textColor;
  textDiv.style.textShadow = s.textStrokeWidth > 0
    ? `0 0 ${s.textStrokeWidth}px ${s.textStrokeColor}, 0 0 ${s.textStrokeWidth}px ${s.textStrokeColor}, 0 0 ${s.textStrokeWidth}px ${s.textStrokeColor}`
    : 'none';
  textDiv.style.display = 'flex';
  textDiv.style.flexDirection = 'column';
  if (s.textHAlign === 'left') { textDiv.style.textAlign = 'left'; textDiv.style.alignItems = 'flex-start'; }
  else if (s.textHAlign === 'right') { textDiv.style.textAlign = 'right'; textDiv.style.alignItems = 'flex-end'; }
  else { textDiv.style.textAlign = 'center'; textDiv.style.alignItems = 'center'; }
  if (s.textVAlign === 'top') textDiv.style.justifyContent = 'flex-start';
  else if (s.textVAlign === 'bottom') textDiv.style.justifyContent = 'flex-end';
  else textDiv.style.justifyContent = 'center';

  textDiv.addEventListener('click', e => e.stopPropagation());
  textDiv.addEventListener('mousedown', e => e.stopPropagation());
  textDiv.addEventListener('paste', e => {
    e.preventDefault();
    document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain'));
  });
  textDiv.addEventListener('drop', e => e.preventDefault());

  const num = document.createElement('span');
  num.className = 'cell-number';
  num.textContent = index + 1;

  cell.appendChild(textDiv);
  cell.appendChild(num);
  attachCaption(g, cell);
}

// -- Table 3: 空白格子 --
function createTable3Cell(g, index) {
  const s = tableSettings[3];
  const cell = document.createElement('div');
  cell.className = 'cell blank';
  cell.style.background = s.cellBgColor;
  cell.style.borderColor = s.cellBorderColor;
  cell.style.borderRadius = s.borderRadius + 'px';

  const input = document.createElement('textarea');
  input.className = 'cell-blank-input';
  input.rows = 3;
  input.placeholder = '';
  input.spellcheck = false;
  input.addEventListener('pointerdown', e => e.stopPropagation());
  input.addEventListener('mousedown', e => e.stopPropagation());
  input.addEventListener('click', e => { e.stopPropagation(); input.focus(); });

  const num = document.createElement('span');
  num.className = 'cell-number';
  num.textContent = index + 1;

  cell.appendChild(input);
  cell.appendChild(num);
  cell.addEventListener('click', () => input.focus());
  attachCaption(g, cell);
}

function attachCaption(g, cell) {
  const wrap = document.createElement('div');
  wrap.className = 'cell-wrap';
  const cap = document.createElement('input');
  cap.className = 'cell-caption';
  cap.type = 'text';
  cap.placeholder = '点击添加文字';
  cap.addEventListener('click', e => { e.stopPropagation(); cap.focus(); });
  cap.addEventListener('mousedown', e => e.stopPropagation());
  cap.addEventListener('pointerdown', e => { e.stopPropagation(); cap.focus(); });
  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'del-cell-btn';
  del.textContent = '×';
  del.title = '删除格子';
  del.addEventListener('pointerdown', e => e.stopPropagation());
  del.addEventListener('click', e => {
    e.stopPropagation();
    removeCellWrap(g, wrap);
  });
  wrap.appendChild(cell);
  wrap.appendChild(cap);
  wrap.appendChild(del);
  g.appendChild(wrap);
}

// ==============================
// 初始化三个表格的格子
// ==============================
function cellFactory(tableNum) {
  if (tableNum === 1) return createTable1Cell;
  if (tableNum === 2) return createTable2Cell;
  return createTable3Cell;
}

function initGrid(tableNum, count) {
  const g = gridEl(tableNum);
  const fn = cellFactory(tableNum);
  for (let i = 0; i < count; i++) fn(g, i);
}

initGrid(1, 16);
initGrid(2, 16);
initGrid(3, 16);

// 添加格子按钮
// ==============================
document.querySelectorAll('.add-cell-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = parseInt(btn.dataset.grid);
    const g = gridEl(t);
    if (btn.dataset.act === 'del') {
      const wraps = g.querySelectorAll('.cell-wrap');
      if (wraps.length <= 1) return;
      wraps[wraps.length - 1].remove();
      updateCellNumbers(g);
      return;
    }
    cellFactory(t)(g, g.children.length);
    updateCellNumbers(g);
  });
});

function removeCellWrap(g, wrap) {
  if (g.querySelectorAll('.cell-wrap').length <= 1) return;
  wrap.remove();
  updateCellNumbers(g);
}

function updateCellNumbers(g) {
  g.querySelectorAll('.cell-number').forEach((n, i) => { n.textContent = i + 1; });
}

  try {
    return String(cp).split('-').filter(Boolean).map(p => String.fromCodePoint(parseInt(p, 16))).join('');
  } catch (e) { return ''; }
}
function faceRank(cp) {
  const n = parseInt(String(cp).split('-')[0], 16);
  if (n >= 0x1F600 && n <= 0x1F64F) return 0;
  if (n >= 0x1F900 && n <= 0x1F9FF) return 1;
  if (n >= 0x1FA70 && n <= 0x1FAFF) return 2;
  return 3;
}
(((window.EMOJI_KITCHEN && window.EMOJI_KITCHEN.pairs) || []).slice().sort((x, y) => {
  if (x[0] !== y[0]) return x[0] === 'face' ? -1 : 1;
  return (faceRank(x[2]) - faceRank(y[2])) || (faceRank(x[3]) - faceRank(y[3])) || String(x[2]).localeCompare(y[2]) || String(x[3]).localeCompare(y[3]);
})).forEach(row => {
  const cat = row[0], d = row[1], a = row[2], b = row[3];
  const ca = cpToCh(a), cb = cpToCh(b);
  emojiAll.push({ cat: cat, ch: ca + cb, q: (ca + ' ' + cb).toLowerCase(), url: kitchenUrl(d, a, b) });
});

function applySprite(el, item, draw) {
  if (!emojiPack || !item) return;
  const cell = emojiPack.size + emojiPack.pad;
  const scale = draw / emojiPack.size;
  el.style.width = draw + 'px';
  el.style.height = draw + 'px';
  el.style.backgroundImage = 'url(' + emojiPack.url + ')';
  el.style.backgroundRepeat = 'no-repeat';
  el.style.backgroundSize = (emojiPack.w * scale) + 'px ' + (emojiPack.h * scale) + 'px';
  el.style.backgroundPosition = '-' + ((item.x * cell + 1) * scale) + 'px -' + ((item.y * cell + 1) * scale) + 'px';
}

function makeSprite(item, draw) {
  if (item && item.url) {
    const img = document.createElement('img');
    img.className = 'emoji-sprite';
    img.src = item.url;
    img.alt = item.ch || '';
    img.draggable = false;
    img.style.width = draw + 'px';
    img.style.height = draw + 'px';
    return img;
  }
  const d = document.createElement('i');
  d.className = 'emoji-sprite';
  applySprite(d, item, draw);
  return d;
}

function visibleEmojis() {
  const q = emojiQuery.toLowerCase();
  return emojiAll.filter(item => {
    if (emojiCat !== 'all' && item.cat !== emojiCat) return false;
    if (!q) return true;
    return (item.q && item.q.indexOf(q) !== -1) || (item.ch && item.ch.indexOf(emojiQuery) !== -1);
  });
}

function renderEmojiCats() {
  const box = document.getElementById('emojiCats');
  box.innerHTML = '';
  EMOJI_CATS.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'emoji-cat' + (emojiCat === c.id ? ' active' : '');
    b.textContent = c.name;
    b.addEventListener('click', () => { emojiCat = c.id; renderEmojiCats(); renderEmojiList(); });
    box.appendChild(b);
  });
}

function renderEmojiList() {
  const box = document.getElementById('emojiList');
  box.innerHTML = '';
  const list = visibleEmojis();
  if (!list.length) {
    box.textContent = emojiPack ? '没有匹配的表情' : '表情资源未加载';
    return;
  }
  let shown = 0;
  const STEP = 400;
  function appendBatch() {
    const frag = document.createDocumentFragment();
    const end = Math.min(list.length, shown + STEP);
    for (let i = shown; i < end; i++) {
      const item = list[i];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'emoji-item';
      b.title = item.ch;
      b.appendChild(makeSprite(item, 32));
      b.addEventListener('pointerdown', ev => startEmojiDrag(item, ev));
      frag.appendChild(b);
    }
    shown = end;
    const more = box.querySelector('.emoji-more');
    if (more) more.remove();
    box.appendChild(frag);
    if (shown < list.length) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'emoji-cat emoji-more';
      btn.style.gridColumn = '1 / -1';
      btn.textContent = '还有 ' + (list.length - shown) + ' 个，再加载 ' + Math.min(STEP, list.length - shown) + ' 个';
      btn.addEventListener('click', appendBatch);
      box.appendChild(btn);
    }
  }
  appendBatch();
}

const STICKER_MIN = 24;
const STICKER_MAX = 320;
let selectedSticker = null;

function selectSticker(el) {
  if (selectedSticker === el) return;
  if (selectedSticker) selectedSticker.classList.remove('is-selected');
  selectedSticker = el || null;
  if (selectedSticker) selectedSticker.classList.add('is-selected');
}

function setStickerSize(el, size, anchor) {
  const next = Math.max(STICKER_MIN, Math.min(STICKER_MAX, Math.round(size)));
  const prev = el._size || 48;
  if (anchor === 'br') {
    el.style.left = (el.offsetLeft + (prev - next)) + 'px';
    el.style.top = (el.offsetTop + (prev - next)) + 'px';
  } else if (anchor === 'bl') {
    el.style.top = (el.offsetTop + (prev - next)) + 'px';
  } else if (anchor === 'tr') {
    el.style.left = (el.offsetLeft + (prev - next)) + 'px';
  }
  el._size = next;
  const face = el.querySelector('.emoji-sprite');
  if (el._item && el._item.url && face) {
    face.style.width = next + 'px';
    face.style.height = next + 'px';
  } else {
    applySprite(face, el._item, next);
  }
}

function placeSticker(item, x, y) {
  const el = document.createElement('div');
  el.className = 'emoji-sticker';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el._item = item;
  el._size = 48;
  el.appendChild(makeSprite(item, 48));

  const xbtn = document.createElement('button');
  xbtn.type = 'button';
  xbtn.className = 'sticker-x';
  xbtn.textContent = '×';
  xbtn.addEventListener('pointerdown', ev => ev.stopPropagation());
  xbtn.addEventListener('click', ev => {
    ev.stopPropagation();
    if (selectedSticker === el) selectedSticker = null;
    el.remove();
  });
  el.appendChild(xbtn);

  [['nw', 'br'], ['ne', 'bl'], ['sw', 'tr'], ['se', 'tl']].forEach(([cls, anchor]) => {
    const h = document.createElement('i');
    h.className = 'sticker-handle ' + cls;
    h.setAttribute('role', 'button');
    h.setAttribute('aria-label', '缩放');
    h.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      ev.stopPropagation();
      if (!el.classList.contains('is-selected')) return;
      const startX = ev.pageX;
      const startY = ev.pageY;
      const startSize = el._size;
      function move(e) {
        const dx = e.pageX - startX;
        const dy = e.pageY - startY;
        const along = cls === 'nw' || cls === 'se' ? (dx + dy) / 2 : (dx - dy) / 2;
        const sign = (cls === 'se' || cls === 'ne') ? 1 : -1;
        setStickerSize(el, startSize + along * sign, anchor === 'tl' ? null : anchor);
      }
      function up() {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
    el.appendChild(h);
  });

  el.addEventListener('pointerdown', ev => {
    if (ev.target === xbtn || ev.target.classList.contains('sticker-handle')) return;
    ev.preventDefault();
    ev.stopPropagation();
    if (!el.classList.contains('is-selected')) {
      selectSticker(el);
      return;
    }
    const ox = ev.pageX - el.offsetLeft;
    const oy = ev.pageY - el.offsetTop;
    function move(e) {
      el.style.left = (e.pageX - ox) + 'px';
      el.style.top = (e.pageY - oy) + 'px';
    }
    function up() {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
    }
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });

  el.addEventListener('wheel', ev => {
    if (!el.classList.contains('is-selected')) return;
    ev.preventDefault();
    setStickerSize(el, el._size + (ev.deltaY > 0 ? -10 : 10), null);
  }, { passive: false });

  document.body.appendChild(el);
  selectSticker(el);
}

document.addEventListener('pointerdown', ev => {
  if (ev.target.closest('.emoji-sticker')) return;
  selectSticker(null);
});

function startEmojiDrag(item, ev) {
  ev.preventDefault();
  const ghost = document.createElement('div');
  ghost.className = 'emoji-sticker';
  ghost.style.opacity = '0.88';
  ghost.style.pointerEvents = 'none';
  ghost.style.left = (ev.pageX - 24) + 'px';
  ghost.style.top = (ev.pageY - 24) + 'px';
  ghost.appendChild(makeSprite(item, 48));
  document.body.appendChild(ghost);
  function move(e) {
    ghost.style.left = (e.pageX - 24) + 'px';
    ghost.style.top = (e.pageY - 24) + 'px';
  }
  function up(e) {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    ghost.remove();
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const dock = document.querySelector('.emoji-dock');
    if (under && dock && dock.contains(under)) return;
    placeSticker(item, e.pageX - 24, e.pageY - 24);
  }
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

document.getElementById('emojiSearch').addEventListener('input', e => {
  emojiQuery = e.target.value.trim();
  renderEmojiList();
});

renderEmojiCats();
renderEmojiList();

// ==============================
// 初始化设置面板
// ==============================
renderSettingsPanel();
</script>
